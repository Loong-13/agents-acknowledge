version: "3.9"

services:
  # ── Neo4j 知识图谱数据库 ──────────────────────
  neo4j:
    image: neo4j:5.18
    container_name: agenthub-neo4j
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PGVector 向量数据库 ───────────────────────
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: agenthub-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agent_knowledge
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (CDC 消息队列) ──────────────────────
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.1}
    container_name: agenthub-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  # ── Python API 服务 ───────────────────────────
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: agenthub-api
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      PGVECTOR_DSN: postgresql+psycopg2://postgres:password@pgvector:5432/agent_knowledge
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      - neo4j
      - pgvector
      - kafka
    volumes:
      - .:/app
      - uploads:/app/uploads

volumes:
  neo4j_data:
  pgvector_data:
  uploads:
