version: "3.9"

services:
  # ── Neo4j 知识图谱数据库 ──────────────────────
  neo4j:
    image: neo4j:5.28-community
    container_name: agenthub-neo4j
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PGVector 向量数据库 ───────────────────────
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: agenthub-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agent_knowledge
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (CDC 消息队列) ──────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: agenthub-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: agenthub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  # ── Python API 服务 ───────────────────────────
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: agenthub-api
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      VECTOR_STORE: pgvector
      VECTOR_STORE_TYPE: pgvector
      PGVECTOR_DSN: postgresql+psycopg2://postgres:password@pgvector:5432/agent_knowledge
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - neo4j
      - pgvector
      - kafka
    volumes:
      - .:/app
      - uploads:/app/uploads

volumes:
  neo4j_data:
  pgvector_data:
  uploads:
